# What it takes to run the package inside a REAL application, outside the test
# bench · `vendor/bin/testbench <command>`.
#
# The test suite forces InnoDB, a throwaway database and a frozen clock. Some
# things only show without that comfort — a migration the machine's default
# engine refuses, a command that assumes a configuration only the bench
# provides, the scheduler as `schedule:list` shows it to an integrator.
#
# The database comes from the environment · export DB_* before calling, or
# leave SQLite in memory for what does not need to persist.

providers:
  - Falcon\Ui\UiServiceProvider
  - Livewire\LivewireServiceProvider
  - Falcon\Analytics\AnalyticsServiceProvider

env:
  # Without it, the cache falls back on the database and asks for a
  # `cache_locks` table that is never migrated here · `schedule:list` stops on it.
  - CACHE_STORE="array"
